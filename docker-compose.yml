services:
  database:
    container_name: "postgres-container"
    image: "postgres:16.6-alpine3.21"
    restart: always
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: "app_container"
    restart: always
    ports:
      - 3000:3000
    depends_on:
      - database
    env_file:
      - ./.env
    volumes:
      - .:/app
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  pgdata:
